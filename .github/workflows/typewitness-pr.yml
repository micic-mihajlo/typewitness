name: TypeWitness PR

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  typewitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          diff-ref: ${{ github.event.pull_request.base.sha }}
          blocking: "false"
          comment: "true"
